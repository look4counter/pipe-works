<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NvidiaDecode — PipeWorks Step</title>
    <link rel="stylesheet" href="style.css" />
    <script src="reference.js" defer></script>
  </head>
  <body>
    <main data-step="NvidiaDecode">
      <section class="parameters" aria-labelledby="NvidiaDecode-parameters">
        <h3 id="NvidiaDecode-parameters">설정 파라미터</h3>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">파라미터</th>
                <th scope="col">기본값</th>
                <th scope="col">설정 위치</th>
                <th scope="col">설명</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row"><code>gpu_id</code></th>
                <td><code>0</code></td>
                <td>생성자 / YAML</td>
                <td>디코딩에 사용할 GPU 장치 번호입니다.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <noscript>Step 문서를 보려면 JavaScript를 활성화하세요.</noscript>
  </body>
</html>
