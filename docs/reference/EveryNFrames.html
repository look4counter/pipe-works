<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EveryNFrames — PipeWorks Step</title>
    <link rel="stylesheet" href="style.css" />
    <script src="reference.js" defer></script>
  </head>
  <body>
    <main data-step="EveryNFrames">
      <section class="parameters" aria-labelledby="EveryNFrames-parameters">
        <h3 id="EveryNFrames-parameters">설정 파라미터</h3>
        <div class="table-scroll">
          <table>
            <thead><tr><th scope="col">파라미터</th><th scope="col">기본값</th><th scope="col">설정 위치</th><th scope="col">설명</th></tr></thead>
            <tbody>
              <tr><th scope="row"><code>steps</code></th><td>필수</td><td>생성자 전용</td><td>입력 하나당 출력 하나를 반환하는 하나 이상의 Step입니다.</td></tr>
              <tr><th scope="row"><code>interval_frames</code></th><td>1</td><td>생성자 / YAML</td><td>첫 입력부터 실행하는 프레임 간격입니다. bool을 제외한 1 이상의 정수입니다.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <noscript>Step 문서를 보려면 JavaScript를 활성화하세요.</noscript>
  </body>
</html>
