<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tap — PipeWorks Step</title>
    <link rel="stylesheet" href="style.css" />
    <script src="reference.js" defer></script>
  </head>
  <body>
    <main data-step="Tap">
      <section class="parameters" aria-labelledby="Tap-parameters">
        <h3 id="Tap-parameters">설정 파라미터</h3>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">파라미터</th>
                <th scope="col">기본값</th>
                <th scope="col">설정 위치</th>
                <th scope="col">설명</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row"><code>step</code></th>
                <td><code>필수</code></td>
                <td>생성자 전용</td>
                <td>
                  백그라운드에서 실행할 Step입니다. Tap 자체의 설정 옵션은
                  없으며 전달된 설정은 감싼 Step으로 위임합니다.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <noscript>Step 문서를 보려면 JavaScript를 활성화하세요.</noscript>
  </body>
</html>
