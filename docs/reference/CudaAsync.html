<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CudaAsync — PipeWorks Step</title>
    <link rel="stylesheet" href="style.css" />
    <script src="reference.js" defer></script>
  </head>
  <body>
    <main data-step="CudaAsync">
      <section class="parameters" aria-labelledby="CudaAsync-parameters">
        <h3 id="CudaAsync-parameters">설정 파라미터</h3>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">파라미터</th>
                <th scope="col">기본값</th>
                <th scope="col">설정 위치</th>
                <th scope="col">설명</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row"><code>steps</code></th>
                <td><code>필수</code></td>
                <td>생성자 전용</td>
                <td>하나 이상의 Step을 위치 인자로 전달합니다.</td>
              </tr>
              <tr>
                <th scope="row"><code>timeout_ms</code></th>
                <td><code>5</code></td>
                <td>생성자 / YAML</td>
                <td>입력별 결과를 기다리는 제한 시간입니다. 제한 시간을 초과하면 원본 입력을 반환합니다.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <noscript>Step 문서를 보려면 JavaScript를 활성화하세요.</noscript>
  </body>
</html>
