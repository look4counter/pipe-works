# 예제 01의 운영 튜닝값이다.
# Source 주소, 모델 경로, Action 대상, Output 주소는 Python 코드에 남긴다.
Pipeline:
  worker_queue_size: 64
  worker_drop_policy: latest

RTSPSource:
  reconnect: true
  reconnect_attempts: 3
  reconnect_interval: 3
  timeout: 10

YoloInference:
  confidence: 0.7
  device: cpu
  fp16: false

Action:
  timeout: 3
  retry: 2
  max_workers: 4
  max_pending: 64

RTSPPublisher:
  codec: h264
  fps: 25
  bitrate: 4M
