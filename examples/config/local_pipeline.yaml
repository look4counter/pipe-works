# 예제 05의 로컬 실행용 설정이다.
# 카메라와 GPU 없이도 실행되도록 CPU를 사용한다.
Pipeline:
  queue_size: 4
  drop_policy: drop_oldest
  worker_queue_size: 64
  worker_drop_policy: latest

Realtime:
  max_end_to_end_latency_ms: 1000
  max_frame_age_ms: 800
  drop_expired_frames: true
  output_latency_action: drop

YoloInference:
  confidence: 0.8
  device: cpu
  fp16: false
