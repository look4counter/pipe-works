RTSPSource:
  reconnect: true
  reconnect_interval_ms: 3000
  transport: tcp
  timeout_ms: 10000

NvidiaDecode:
  gpu_id: 0

NvidiaEncode:
  gpu_id: 0
  fps: 30

RTSPPublish:
  reconnect: true
  reconnect_interval_ms: 3000
  transport: tcp
  timeout_ms: 10000
  packet_size: 1452

YoloDetect:
  # id: vehicle  # 생략하면 모델 파일명, 여러 실행 단계는 생성자에서 서로 다른 ID 지정
  gpu_id: 0
  inference_interval_frame: 1
  classes: [2]
  confidence: 0.25

BoxOverlay:
  id: null  # null이면 전체 모델, 문자열이면 해당 ID만 표시
  line_width: 2
  line_color: "#00ff00"
  keep_previous: true

TensorRTPreProcess:
  size: [640, 640]  # [높이, 너비]
  resize_mode: letterbox  # letterbox, stretch, resize_center_crop
  auto: false  # true이면 stride 기준 최소 패딩으로 출력 크기가 달라질 수 있음
  stride: 32
  scaleup: true  # letterbox에서 작은 이미지 확대 허용
  center: true  # letterbox 중앙 배치, false이면 왼쪽 위 배치
  padding_value: 114  # 정규화 전 0~255 값 또는 출력 채널 순서의 값 3개
  crop_size: null  # resize_center_crop에서만 지정, null이면 size 사용
  color_order: rgb
  scale: 0.00392156862745098  # 정규화: (픽셀 * scale - mean) / std
  mean: [0, 0, 0]  # 출력 채널 순서의 평균
  std: [1, 1, 1]  # 출력 채널 순서의 양수 표준편차
  dtype: float32
  layout: nchw
  input_name: null  # null이면 단일 텐서, 이름을 지정하면 {이름: 텐서}

TensorRTInference:
  # id: vehicle  # 생략하면 모델 파일명, 같은 모델을 여러 번 쓰면 생성자에서 각각 지정
  gpu_id: 0
  inference_interval_frame: 1
  profile_index: 0

TensorRTPostProcess:
  classes: [2]
  confidence: 0.25
  iou: 0.7
  max_det: 300
