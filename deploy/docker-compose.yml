services:
  pipeworks:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${PIPEWORKS_BASE_IMAGE:-python:3.11-slim}
        PIPEWORKS_EXTRAS: ${PIPEWORKS_EXTRAS:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
