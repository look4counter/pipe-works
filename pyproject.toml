[project]
name = "pipe-works"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]
gstreamer = [
    "PyGObject>=3.46",
]
yolo = [
    "ultralytics>=8.3,<9.0",
]
mq = [
    "pika>=1.3,<2.0",
]
all = [
    "PyGObject>=3.46",
    "ultralytics>=8.3,<9.0",
    "pika>=1.3,<2.0",
]

[project.urls]
Repository = "https://github.com/look4counter/pipe-works"
Documentation = "https://github.com/look4counter/pipe-works/tree/main/docs"

[project.scripts]
pipeworks = "pipeworks.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeworks = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--confcutdir=tests/sdk"
testpaths = ["tests/sdk"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
