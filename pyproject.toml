[project]
name = "pipe-works"
version = "0.1.0"
requires-python = "==3.11.9"
dependencies = [
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[project.scripts]
pipeworks = "pipeworks.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--confcutdir=tests/sdk"
testpaths = ["tests/sdk"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
