[project]
name = "pipe-works"
version = "0.1.0"
requires-python = "==3.11.9"
dependencies = [
    "av==18.1.0",
    "pyyaml==6.0.3",
    "PyNvVideoCodec==2.2.2",
    "torch==2.2.1+cu121",
    "torchvision==0.17.1+cu121",
    "numpy==1.26.4",
    "ultralytics==8.4.146",
    "tensorrt==10.10.0.31",
    "onnx==1.18.0",
    "onnxslim==0.1.82",
    "cloudpickle==3.1.2",
]

[project.urls]
Repository = "https://github.com/look4counter/pipe-works"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeworks = ["py.typed"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
